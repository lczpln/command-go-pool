server:
  host: 127.0.0.1
  port: 8787
  # apiKey is generated on first start (cgp_…). Override with COMMAND_GO_POOL_API_KEY.
routing:
  mode: sticky
  sessionTtlHours: 24
  maxFailoversPerRequest: 2
quota:
  refreshIntervalSeconds: 60
dashboard:
  enabled: true
aliases:
  flash: deepseek/deepseek-v4-flash
  vision: deepseek/deepseek-v4-flash-vision-exp
  pro: deepseek/deepseek-v4-pro
models:
  disabled: []
fallback:
  enabled: false
