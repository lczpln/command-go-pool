name: publish
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run pack:check
      - run: npm install -g npm@latest
      - run: npm publish --access public --ignore-scripts
