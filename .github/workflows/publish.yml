name: publish
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: What to publish
        type: choice
        options:
          - both
          - docker
          - npm
        default: docker
permissions:
  id-token: write
  contents: read
  packages: write
  attestations: write
jobs:
  npm:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'docker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run pack:check
      - run: npm install -g npm@latest
      - name: Publish npm
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && npm view "command-go-pool@$VERSION" version >/dev/null 2>&1; then
            echo "command-go-pool@$VERSION is already on npm; skipping (workflow_dispatch)."
            exit 0
          fi
          npm publish --access public --ignore-scripts
  docker:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'npm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.pkg.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.pkg.outputs.version }}
            type=raw,value=latest
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
